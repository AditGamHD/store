<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DitzXstore</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <div class="container">
                <div class="header-content">
                    <button class="menu-toggle" aria-label="Toggle menu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <a href="#/" class="logo">
                        <div class="logo-placeholder">
                            <i class="fas fa-store"></i>
                        </div>
                        <span class="logo-text">DitzXstore</span>
                    </a>
                    <nav class="main-nav">
                        <div class="nav-group">
                            <a href="#/" class="nav-link" data-i18n="nav.home">Home</a>
                            <a href="#/about" class="nav-link" data-i18n="nav.about">Tentang</a>
                        </div>
                    </nav>
                    <div class="header-actions">
                        <div class="search-container">
                            <input type="text" class="search-input" placeholder="Cari produk..." data-i18n-placeholder="search.placeholder">
                            <button class="search-btn" aria-label="Search">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                        <div class="language-switcher">
                            <select class="language-select" aria-label="Select language">
                                <option value="id">🇮🇩 ID</option>
                                <option value="en">🇬🇧 EN</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="container">
                <div class="page-content" id="page-content">
                    <!-- Content will be dynamically rendered here -->
                    <div class="skeleton-container">
                        <div class="skeleton-header"></div>
                        <div class="skeleton-filters"></div>
                        <div class="products-grid">
                            <div class="product-card skeleton-card"></div>
                            <div class="product-card skeleton-card"></div>
                            <div class="product-card skeleton-card"></div>
                            <div class="product-card skeleton-card"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="main-footer">
            <div class="container">
                <div class="footer-content">
                    <div class="footer-section">
                        <div class="footer-logo">
                            <div class="logo-placeholder small">
                                <i class="fas fa-store"></i>
                            </div>
                            <span class="footer-store-name">DitzXstore</span>
                        </div>
                        <p class="footer-tagline" data-i18n="footer.tagline">Marketplace untuk kebutuhan digital Anda.</p>
                    </div>
                    <div class="footer-section">
                        <h3 data-i18n="footer.links">Tautan</h3>
                        <a href="#/" class="footer-link" data-i18n="nav.home">Home</a>
                        <a href="#/about" class="footer-link" data-i18n="nav.about">Tentang</a>
                        <a href="#/about?page=privacy" class="footer-link" data-i18n="nav.privacy">Privasi</a>
                    </div>
                    <div class="footer-section">
                        <h3 data-i18n="footer.contact">Kontak</h3>
                        <p class="footer-contact-info" data-i18n="footer.wa">WhatsApp: +62 856 4821 1278</p>
                        <p class="footer-contact-info" data-i18n="footer.email">Email: adit.gam775@gmail.com</p>
                    </div>
                </div>
                <div class="footer-bottom">
                    <p class="copyright">© 2025 ADITdeveloper</p>
                </div>
            </div>
        </footer>

        <div class="whatsapp-cta" id="whatsapp-cta" style="display: none;">
            <button class="whatsapp-button" id="whatsapp-button" aria-label="Beli via WhatsApp">
                <i class="fab fa-whatsapp"></i>
                <span data-i18n="button.buy">Beli via WhatsApp</span>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
